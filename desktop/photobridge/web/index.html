<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4353ff">
  <title>PhotoBridge</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img src="/static/icon.svg" alt="" width="36" height="36">
      <span>Photo<b>Bridge</b></span>
    </div>
    <p id="computer" class="status">Conectando…</p>
  </header>

  <main class="card">
    <!-- 1. Elegir -->
    <section id="step-pick">
      <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      </div>
      <h1>Pasa tus fotos al ordenador</h1>
      <p class="lead">Elige las fotos y vídeos que quieras. Puedes seleccionar muchas a la vez.</p>
      <label class="btn btn-primary btn-big">
        <input id="file-input" type="file" accept="image/*,video/*" multiple hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Elegir fotos
      </label>
    </section>

    <!-- 2. Confirmar -->
    <section id="step-confirm" hidden>
      <div id="preview" class="preview"></div>
      <h2 id="selected-count"></h2>
      <p id="selected-size" class="muted"></p>
      <button id="send-button" class="btn btn-primary btn-big" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        Enviar al ordenador
      </button>
      <button id="repick-button" class="btn btn-ghost" type="button">Elegir otras</button>
    </section>

    <!-- 3. Enviando -->
    <section id="step-sending" hidden>
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4353ff"/>
              <stop offset="1" stop-color="#19c3fb"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle id="ring-value" class="ring-value" cx="60" cy="60" r="52"/>
        </svg>
        <span id="progress-percent">0 %</span>
      </div>
      <h2>Enviando <span id="progress-count"></span></h2>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-detail" class="muted small ellipsis"></p>
      <p class="notice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
        No cierres esta página ni bloquees el móvil hasta que termine.
      </p>
    </section>

    <!-- 4. Terminado -->
    <section id="step-done" hidden>
      <div id="done-icon" class="done-icon">
        <svg class="icon-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <svg class="icon-error" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5"/><path d="M12 17h.01"/></svg>
      </div>
      <h2 id="done-title">¡Listo!</h2>
      <p id="done-message" class="muted"></p>
      <ul id="failed-list" class="failed" hidden></ul>
      <button id="retry-button" class="btn btn-primary" type="button" hidden>Reintentar las que fallaron</button>
      <button id="more-button" class="btn btn-ghost" type="button">Enviar más fotos</button>
    </section>
  </main>

  <p class="footnote">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Tus fotos van directas a tu ordenador por tu wifi
  </p>
  <script src="/static/app.js"></script>
</body>
</html>
